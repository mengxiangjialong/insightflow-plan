server:
  port: 8080

spring:
  application:
    name: inkplan-backend
  datasource:
    url: jdbc:mysql://localhost:3306/inkplan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

inkplan:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me}
    ttl-seconds: 604800
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8080
  ai:
    # 预留：接入 DeepSeek / OpenAI / 通义千问 等
    provider: mock
    api-key: ${AI_API_KEY:}

logging:
  level:
    com.inkplan: INFO