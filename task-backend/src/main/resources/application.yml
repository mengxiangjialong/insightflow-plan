server:
  port: 8080

spring:
  application:
    name: task-backend
  datasource:
    url: jdbc:mysql://localhost:3306/inkplan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

inkplan:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me}
    ttl-seconds: 604800
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8080
  github:
    # GitHub OAuth App: https://github.com/settings/developers
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    # 必须与 OAuth App 中的 Authorization callback URL 完全一致
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
    # 授权完成后跳回前端的页面（携带 ?token=JWT）
    frontend-callback: ${GITHUB_FRONTEND_CALLBACK:http://localhost:5173/oauth/github}
  ai:
    # 预留：接入 DeepSeek / OpenAI / 通义千问 等
    provider: mock
    api-key: ${AI_API_KEY:}

logging:
  level:
    com.inkplan: INFO